name: CastSideChatFixture
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Fixture:
    type: application
    platform: iOS
    sources:
      - path: ../../Sources
        excludes: ['App/CastApp.swift', 'Resources/**']
      - SideChatFixtureApp.swift
    dependencies:
      - package: MarkdownUI
      - package: HighlightSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast.sidechatfixture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  FixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../SideChatUITests]
    dependencies:
      - target: Fixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast.sidechatfixture.uitests
  FixtureMac:
    type: application
    platform: macOS
    deploymentTarget: '15.0'
    sources:
      - path: ../../Sources
        excludes: ['App/CastApp.swift', 'Resources/**']
      - SideChatFixtureApp.swift
    dependencies:
      - package: MarkdownUI
      - package: HighlightSwift
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast.sidechatfixture.mac
        ENABLE_HARDENED_RUNTIME: NO
  FixtureMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '15.0'
    sources: [../SideChatUITests]
    dependencies:
      - target: FixtureMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast.sidechatfixture.mac.uitests
schemes:
  FixtureMac:
    build:
      targets:
        FixtureMac: all
    test:
      targets: [FixtureMacUITests]
  Fixture:
    build:
      targets:
        Fixture: all
    test:
      targets: [FixtureUITests]
