name: Cast
options:
  bundleIdPrefix: com.besttechie
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    exactVersion: 1.1.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 10
    # Scripts/generate-project.sh injects the committed source SHA before Xcode evaluates
    # the Info plist. Release/archive builds must regenerate through that wrapper.
    CAST_GIT_SHA: "${GIT_COMMIT_SHA}"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_NAME: Cast
    PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Cast-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["**/__pycache__/**"]
    dependencies:
      - package: Sparkle
      - package: MarkdownUI
      - package: HighlightSwift
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Support/Cast-macOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CastGitSHA: "$(CAST_GIT_SHA)"
        SUFeedURL: "$(CAST_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(CAST_UPDATE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: "© 2026 BestTechie Holdings"
        NSMicrophoneUsageDescription: "Cast uses the microphone for local dictation and voice messages."
        NSSpeechRecognitionUsageDescription: "Cast turns speech into editable drafts using on-device recognition."

  Cast-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/__pycache__/**"]
    dependencies:
      - package: MarkdownUI
      - package: HighlightSwift
      - target: CastShareExtension
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Support/Cast-iOS.entitlements
        CAST_APNS_ENVIRONMENT: development
    info:
      path: Support/Cast-iOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CastGitSHA: "$(CAST_GIT_SHA)"
        UILaunchScreen: {}
        CastAPNSEnvironment: "$(CAST_APNS_ENVIRONMENT)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Cast scans OpenClaw workspace pairing QR codes."
        NSLocalNetworkUsageDescription: "Cast connects directly to OpenClaw gateways on your local network."
        NSMicrophoneUsageDescription: "Cast uses the microphone for local dictation and voice messages."
        NSSpeechRecognitionUsageDescription: "Cast turns speech into editable drafts using on-device recognition."
        CFBundleURLTypes:
          - CFBundleURLName: com.besttechie.cast
            CFBundleURLSchemes: [cast]

  CastShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Sources/ShareSupport
    settings:
      base:
        PRODUCT_NAME: CastShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Support/CastShareExtension.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Support/CastShareExtension-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Cast
        NSExtension:
          NSExtensionAttributes:
            # Match only representations the extension can ingest. `extensionItems` is
            # a host-provided key path (not an NSPredicate substitution variable), and
            # every attachment must expose at least one supported representation.
            NSExtensionActivationRule: >-
              SUBQUERY(
                extensionItems,
                $item,
                (
                  $item.attachments.@count > 0
                  AND $item.attachments.@count <= 20
                  AND SUBQUERY(
                    $item.attachments,
                    $att,
                    ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                     OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
                     OR ANY $att.registeredTypeIdentifiers == "com.apple.uikit.image"
                     OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
                     OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie"
                     OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio"
                     OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
                     OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.content"
                  ).@count == $item.attachments.@count
                )
                OR (
                  $item.attachments.@count == 0
                  AND $item.attributedContentText.length > 0
                )
              ).@count == extensionItems.@count
              AND extensionItems.@count > 0
              AND extensionItems.@count <= 20
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"

  CastTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/CastTests]
    dependencies:
      - target: Cast-macOS
    settings:
      base:
        PRODUCT_NAME: CastTests
        PRODUCT_BUNDLE_IDENTIFIER: com.besttechie.cast.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cast.app/Contents/MacOS/Cast"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Cast-macOS:
    build:
      targets:
        Cast-macOS: all
        CastTests: [test]
    test:
      targets:
        - CastTests
  Cast-iOS:
    build:
      targets:
        Cast-iOS: all
